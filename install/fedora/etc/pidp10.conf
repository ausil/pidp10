# /etc/pidp10/pidp10.conf
#
# Site overrides for the PiDP-10: what to boot, which panel driver, which
# console port. systemd EnvironmentFile syntax - KEY=value, no export, no
# shell expansion - because the units read this file through EnvironmentFile=
# and the shell helpers source it directly, so one file means the same thing
# to `systemctl start pidp10@1.service` and to `pdp con`.
#
# The layout (PIDP10_PREFIX / PIDP10_STATE / PIDP10_BIN / PIDP10_LIBEXEC) is
# deliberately NOT set here. Those are baked in when the project is built -
# the top-level Makefile rewrites them into the units, the helpers and the
# front doors with the --prefix/--libdir it was given - and naming them here
# would make a package built for another prefix go looking in /usr. To move
# the state directory for real, use a drop-in, so the override shows up in
# `systemctl cat`:
#
#   /etc/systemd/system/pidp10@.service.d/override.conf
#   [Service]
#   Environment=PIDP10_STATE=/srv/pidp10
#
# and remember the shell helpers will not see it; they take /var/lib/pidp10
# unless PIDP10_STATE is in their environment.

# Developer shortcut, not a packaging knob. Pointed at a checkout (or the old
# /opt/pidp10 tree) it is used as a last-resort search directory for the
# engines and the vendored device sims, so `git clone` +
# `PIDP10_HOME=$PWD install/fedora/libexec/pidp10-engine 1` keeps working with
# nothing installed. Do not set it on a packaged system.
#PIDP10_HOME=/opt/pidp10

# User the PDP-10 engine runs as. Created by systemd-sysusers from
# install/fedora/sysusers.d/30-pidp10.conf. Must be in the gpio group for the
# front panel (see udev.d/99-pidp10.rules).
PIDP10_USER=pidp10

# Which system to boot:
#   0  = blinkenlights demo (hills-blinky)
#   1  = ITS
#   2  = TOPS-10 (6.03)
#   4  = WAITS
#   8  = (octal 0010) - see systems/selections for the table
# Values >= 16 (decimal) select pdp10-ki, >= 64 select pdp10-kl.
# Overridden per-start with: systemctl start pidp10@1.service
PIDP10_BOOT=1

# Which front-panel driver to use:
#   auto    - probe: use gpiod if a usable gpiochip is present, else sim
#   gpiod   - kernel GPIO character device via libgpiod (Pi 4/5 on Fedora)
#   gpiomem - legacy /dev/gpiomem register mapping (Raspberry Pi OS only)
#   sim     - no hardware, log blinkenlight updates to the journal
# Naming a hardware backend is a demand, not a preference: if it cannot be
# opened the engine says so instead of quietly running without lights. "sim"
# is what a development machine without a cabinet wants.
PIDP10_PANEL=auto

# Name (or /dev/gpiochipN path) of the gpiochip carrying the panel.
# On a Pi 5 under Fedora the panel GPIOs live on the RP1 chip:
#   pidp-gpio-probe --list   # shows every chip, its label, and whether the
#                            # 22 panel lines on it are free
# will show it (a Broadcom controller with >=28 lines; line offsets == legacy
# BCM GPIO numbers, which are the numbers ka10_pipanel.c already uses).
# Leave empty to auto-detect. For PIDP10_PANEL=gpiomem this is a pinctrl
# compatible/name instead of a gpiochip, so one value cannot serve both.
PIDP10_GPIO_CHIP=

# Set to 1 to let PIDP10_GPIO_CHIP point at a chip that is NOT a Broadcom
# GPIO controller (a GPIO expander, a non-Pi SBC).
#
# Refusing such chips is the whole point of the probe: /dev/gpiochipN exists
# on machines that are not PiDP-10 cabinets, and their line 22 is somebody
# else's hardware - on a Qualcomm laptop most of the fourteen chips are PMIC
# power rails. Two settings (this plus PIDP10_GPIO_CHIP) are needed to drive
# anything that does not identify itself as a Pi controller. Leave this unset
# unless you are holding the wiring diagram.
#PIDP10_PANEL_FORCE=1

# Cap the button scan in Hz. The LED scan is a couple of ioctls per row; the
# button scan additionally has to reconfigure 18 lines from output to input,
# which is the expensive part on the character device. Unset == scan every
# frame (upstream behaviour); 100 is already far faster than a hand can move.
#PIDP10_SWITCH_HZ=100

# Console (simh TMXR) port. The boot scripts ask for it with simh's own
# environment substitution:
#
#     set cons -u telnet=%PIDP10_CONSOLE_PORT%
#
# (simh expands %NAME% in command files from the environment; $NAME does NOT
# work there - that form is only for the shell lines introduced by '!').
# Change this and the console really does move; pidp10-stop uses the same value
# to ask the simulator to power down politely.
PIDP10_CONSOLE_PORT=1025

# PIDP10_MANAGED is deliberately absent: the engine units set it themselves.
# Setting it here would also apply it to `pdp con` runs straight from a shell,
# where pidp10-spawn is exactly what starts cbridge and tv11.
