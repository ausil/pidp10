# systemd-sysusers fragment: the unprivileged account the PDP-10 runs as.
#
#  systemd-sysusers(8)
#  install -D -m 0644 30-pidp10.conf /usr/lib/sysusers.d/30-pidp10.conf
#
# The account gets its own group, and udev.d/99-pidp10.rules gives that group
# the panel's device nodes. Deliberately not the distribution's "gpio" group:
# joining it would hand the simulator (and anything that escapes it) every
# gpiochip on the machine rather than the 22 lines the panel is wired to, and
# re-tagging all of them to a group another package owns is not ours to do.
u pidp10 - "PiDP-10 simulator" /var/lib/pidp10 /sbin/nologin
g pidp10 - -

# i2c-dev clients (the real-time clock, the panel EEPROM). Fedora's i2c group
# only exists once i2c-tools is installed; declaring it here keeps the engine
# unit's SupplementaryGroups=i2c meaningful on a minimal install.
g i2c - -
m pidp10 i2c
