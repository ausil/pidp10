#
# Raise RLIMIT_RTPRIO for graphical sessions so the front-panel multiplexing
# thread can use SCHED_FIFO 98 without setuid/setcap.
#
#   install -D -m 0644 60-pidp10-rt.conf /etc/systemd/logind.conf.d/60-pidp10-rt.conf
#   systemctl restart systemd-logind   (or just re-login)
#
# Verify from the session:  ulimit -r   ->  99
#
# Note: sched_setscheduler(SCHED_FIFO, n) is permitted for an unprivileged
# process as long as n <= RLIMIT_RTPRIO, so no capability is involved. If you
# also run the headless system unit, that one uses AmbientCapabilities=
# CAP_SYS_NICE instead (see systemd/system/pidp10-engine@.service).

[Login]
# -1 would mean unlimited; 99 matches the priority ka10_pipanel.c asks for.
DefaultLimitRTPRIO=99
