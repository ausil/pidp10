;
; The PDP-6 side of the cabinet, run by pidp10-pdp6.service as
;
;     pdp6 /usr/share/pidp10/conf/pdp6.ini
;
; in the screen session "pidp6". The console is that session's terminal, so
; `pdp pdp6` attaches to the PDP-6 console, and ^E there gives sim>.
;
; It shares memory with the KA10 running ITS. The KA10 side lives in
; systems/its/boot.pi{,dp}:
;
;     set auxcpu enabled
;     at -u auxcpu 10006
;
; so the KA10 listens and this end connects. ITS sees PDP-6 memory through
; the auxcpu window at 03000000, and both machines interrupt each other over
; the same link. A connect= line keeps retrying, so either machine can be
; started first.
;
; %NAME% is simh's environment substitution. The unit sets the default and
; /etc/pidp10/pidp10.conf can override it.

echo
echo =====================================================================
echo PDP-6: shared memory with the KA10 via %PIDP10_PDP6_AUXCPU%
echo ^E for the sim> prompt, then "c" to continue. Ctrl-A d detaches.
echo =====================================================================
echo

set cpu idle

set slave enabled
attach slave connect=%PIDP10_PDP6_AUXCPU%

; The Type 340 display was the PDP-6's (Spacewar). The ITS boot already
; opens a 340 window for the KA10, so this one stays off by default. To use
; it, enable it here and turn the KA10's off ("set dpy dis" in the boot
; script).
;set dpy enabled

; simh only polls the slave link while the CPU runs, so leave it spinning in a
; JRST . loop that ITS can take over. Halt it from the console with ^E.
d 1000 254000001000
go 1000
