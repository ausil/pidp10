# systemd-tmpfiles fragment for PiDP-10 runtime state.
#
#  install -D -m 0644 pidp10.conf /usr/lib/tmpfiles.d/pidp10.conf
#  systemd-tmpfiles --create /usr/lib/tmpfiles.d/pidp10.conf
#
# Note: cbridge/gateway.sh communicate through /tmp/chaos_stream, so the
# services deliberately run WITHOUT PrivateTmp=.
d /run/pidp10 0755 pidp10 pidp10 -
d /var/lib/pidp10 0755 pidp10 pidp10 -
d /var/log/pidp10 0755 pidp10 pidp10 -
