# systemd-tmpfiles fragment for PiDP-10 runtime state.
#
#  install -D -m 0644 pidp10.conf /usr/lib/tmpfiles.d/pidp10.conf
#  systemd-tmpfiles --create /usr/lib/tmpfiles.d/pidp10.conf
#
# Note: cbridge/gateway.sh communicate through /tmp/chaos_stream, so the
# services deliberately run WITHOUT PrivateTmp=.
d /run/pidp10 0755 pidp10 pidp10 -
d /var/lib/pidp10 0755 pidp10 pidp10 -
d /var/log/pidp10 0755 pidp10 pidp10 -
#
# The system directories ship with the package (boot.pi / boot.pidp and the
# selections table, installed by the top-level Makefile into
# ${SYSTEMSDIR:-/var/lib/pidp10}/systems), but they are written to at run time:
# pidp10-fetch-images unpacks ~2 GB of disk and tape images into them, and
# simh, running as pidp10, creates its logs and default attachments there. So
# they have to belong to pidp10 whatever installed them - the spec sets that
# with %attr, and these lines are what fixes the ownership after a plain
# `make install`, which cannot chown on a build host that has no pidp10 user
# (and would not want to touch a live /var).
# `d` adjusts mode and ownership of an existing directory, and creates it when
# it is absent, so an upgrade that adds a system is covered by the package and
# a checkout-based install by these lines. A system missing from this list is
# not fatal: it just stays root-owned, and pidp10-fetch-images says so.
d /var/lib/pidp10/systems 0755 pidp10 pidp10 -
d /var/lib/pidp10/systems/hills-blinky 0755 pidp10 pidp10 -
d /var/lib/pidp10/systems/its 0755 pidp10 pidp10 -
d /var/lib/pidp10/systems/tops10-603 0755 pidp10 pidp10 -
d /var/lib/pidp10/systems/tops20 0755 pidp10 pidp10 -
